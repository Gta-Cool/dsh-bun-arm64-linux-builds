name: Release Build (Bun Sidecar + Tauri v2)

on:
  push:
  #  tags:
  #    - "v*"
    branches: [ dev-ci ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux arm64 (.AppImage & .deb)
          - os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & Tauri system dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Build Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install monorepo dependencies
        run: bun install

      - name: Build Web UI & Compile Target-Specific Bun Sidecar
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.rust_target }}
          BUN_TARGET: ${{ matrix.bun_target }}
          EXT: ${{ matrix.ext }}
        run: |
          bun run build:sidecar

      - name: Build Tauri v2 Installers & Upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: true
          NO_STRIP: true
          LD_LIBRARY_PATH: /usr/lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness (Bun Edition) ${{ github.ref_name }}"
          releaseBody: |
            ## DeepSeek Harness — Native Bun + Elysia + Tauri v2 Edition (${{ github.ref_name }})
            Zero Node.js. Zero Electron. Powered by Bun, Elysia, Cordis, and Tauri v2.

            ### Downloads
            - **Linux (arm64):** `.AppImage` or `.deb`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }} --verbose

      - name: Upload Standalone Headless CLI Binary and Ripgrep to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp ./apps/desktop/src-tauri/binaries/dsh-bun-${{ matrix.rust_target }}${{ matrix.ext }} ./dsh-bun-${{ matrix.rust_target }}${{ matrix.ext }}
          gh release upload ${{ github.ref_name }} ./dsh-bun-${{ matrix.rust_target }}${{ matrix.ext }} --clobber
          if [ -f "./apps/desktop/src-tauri/binaries/rg${{ matrix.ext }}" ]; then
            cp ./apps/desktop/src-tauri/binaries/rg${{ matrix.ext }} ./rg-${{ matrix.rust_target }}${{ matrix.ext }}
            gh release upload ${{ github.ref_name }} ./rg-${{ matrix.rust_target }}${{ matrix.ext }} --clobber
          fi
